name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host tests and public source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install host dependencies
        run: python -m pip install -r requirements-tools.txt pip-audit==2.10.1
      - name: Audit host dependencies
        run: python -m pip_audit -r requirements-tools.txt
      - name: Audit font-generation dependencies
        run: python -m pip_audit -r firmware/components/forearm_fonts/tools/font-requirements.txt
      - name: Test portable message model
        run: |
          cmake -S core -B build/core -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/core
          ctest --test-dir build/core --output-on-failure
      - name: Test setup and USB helper without hardware
        run: |
          python -m unittest discover -s tools/tests -v
          python -m py_compile tools/device.py tools/provision_stdin.py tools/hardware_check.py tools/check_public_tree.py
          node --check tools/setup.mjs
      - name: Test fail-closed firmware license gating without the SDK
        run: |
          python -m unittest discover -s tools/tests_licenses -v
          python -m py_compile tools/audit_firmware_licenses.py tools/review_firmware_license_inputs.py
      - name: Check public source candidate
        run: python tools/check_public_tree.py
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan source and complete Git history
        run: |
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner .
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=--all .

  firmware:
    name: ESP32-S3 build (${{ matrix.network }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        network: ['ON', 'OFF']
    # espressif/idf:v5.3.6, immutable multi-platform manifest.
    container: espressif/idf@sha256:cee52f0c4fdaf088992a7a739f5993154e95cf1d3ab61c24f5b40e6d56a3a070
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build firmware
        id: build
        shell: bash
        env:
          FOREARM_NETWORK_BUILD: ${{ matrix.network }}
          IDF_TARGET: esp32s3
        run: |
          . /opt/esp/idf/export.sh
          idf.py -C firmware -DFOREARM_NETWORK="$FOREARM_NETWORK_BUILD" build
      - name: Verify fonts and full-frame composition
        if: matrix.network == 'ON'
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          sh firmware/components/forearm_fonts/tools/check-font.sh
          python firmware/components/forearm_panel/tests/run_host.py
          python tools/tests_ui/run_host.py
          python tools/tests_startup/run_host.py
      - name: Audit exact network firmware license inputs
        id: license_audit
        if: ${{ !cancelled() && matrix.network == 'ON' && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          python tools/audit_firmware_licenses.py --build-dir firmware/build --output firmware/build/license-audit.json
      - name: Upload normalized license failure report
        if: ${{ !cancelled() && steps.license_audit.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: license-audit-esp32s3-${{ matrix.network }}
          path: firmware/build/license-audit.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
